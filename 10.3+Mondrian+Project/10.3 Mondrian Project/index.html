<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mondrian Project</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      body > div > div {
        background-color: #f0f1ec;
      }
      .main-container {
        width: 748px;
        height: 748px;
        display: grid;
        grid-template-rows: 414px 325px;
        grid-template-columns: 320px 419px;
        gap: 9px;
        background-color: #000;
      }
      .intermediate-1 {
        background-color: #e72f24;
      }
      .intermediate-3 {
        display: flex;
        flex-direction: column;
        gap: 10px;
        background-color: #000;
      }
      .intermediate-3-inner-1 {
        height: 295px;
        background-color: #f0f1ec;
      }
      .intermediate-3-inner-2 {
        height: 20px;
        background-color: #f0f1ec;
      }
      .intermediate-4 {
        display: flex;
        gap: 9px;
        background-color: #000;
      }
      .intermediate-4-inner-1 {
        width: 351px;
        height: 325px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .intermediate-4-inner-1-1 {
        flex-basis: 295px;
        background-color: #f0f1ec;
      }
      .intermediate-4-inner-1-2 {
        display: flex;
        flex-basis: 21px;
        gap: 9px;
      }
      #inner-1-2-1 {
        flex-basis: 198px;
        background-color: #f9d01e;
      }
      #inner-1-2-2 {
        flex-basis: 153px;
        background-color: #232629;
      }
      .intermediate-4-inner-2 {
        width: 50px;
        height: 325px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #inner-2-1 {
        flex-basis: 130px;
        background-color: #004592;
      }
      #inner-2-2 {
        flex-basis: 185px;
        background-color: #f0f1ec;
      }

      /*
      Write your CSS here
      Gap Colour: #000
      White: #F0F1EC
      Red: #E72F24
      Black: #232629
      Blue: #004592
      Yellow: #F9D01E

      For dimensions, see dimensions.png image.
      HINT: Remember you can't change the properties of grid lines.
      But grid lines are transparent!
      */
    </style>
  </head>

  <body>
    <div class="main-container">
      <div class="intermediate-1"></div>
      <div></div>
      <div class="intermediate-3">
        <div class="intermediate-3-inner-1"></div>
        <div class="intermediate-3-inner-2"></div>
      </div>
      <div class="intermediate-4">
        <div class="intermediate-4-inner-1">
          <div class="intermediate-4-inner-1-1"></div>
          <div class="intermediate-4-inner-1-2">
            <div id="inner-1-2-1"></div>
            <div id="inner-1-2-2"></div>
          </div>
        </div>
        <div class="intermediate-4-inner-2">
          <div id="inner-2-1"></div>
          <div id="inner-2-2"></div>
        </div>
      </div>
    </div>
  </body>
</html>
